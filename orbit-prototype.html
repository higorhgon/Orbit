<style>
/* Layout: full-bleed WebGL scene, thin HUD strip pinned to the bottom, boot overlay on top */
:root {
  --void: #07010e;

  --pod-deep: #4a0080;

  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--plum);
  color: var(--ion);
  font-family: var(--font-mono);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
/* stage: the launcher's screen. The transform makes its fixed-position children (HUD, Files,
   CRT glass) lay out inside it, so letterboxing to 16:9 or 4:3 frames the whole UI */

body.boxed { background: #000; }
.view { position: fixed; z-index: 20; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  padding: 6px 12px; background: rgba(26, 0, 51, 0.7); border: 1px solid var(--pod-edge); color: #f2c8ff;
  font: 11px var(--font-mono); letter-spacing: 0.2em; cursor: pointer;
  box-shadow: 0 0 8px rgba(204, 51, 255, 0.5);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.view:focus-visible { outline: 1px solid var(--pod-glow); outline-offset: 3px; }
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
/* CRT glass over everything (scene + HUD): fine scanlines, rolling flicker band, dark corners */
.crt { position: fixed; inset: 0; pointer-events: none; z-index: 10;
  background:
    radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%),

.crt::after { content: ""; position: absolute; left: 0; right: 0; height: 18%; top: -18%;

  animation: roll 7s linear infinite; }
@keyframes roll { to { top: 100%; } }

.hud {

  left: 0; right: 0; bottom: 0;

  padding-right: max(16px, env(safe-area-inset-right, 0px));

.top {
  position: fixed; left: 0; right: 0; top: 0;

  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) 0;

.nav {

  position: relative; display: inline-grid; place-items: center; width: 46px; height: 34px; margin-right: 12px;

/* purple fill sits slightly down-right; the thick frame is a separate layer on top of it */
.pod::after { inset: 1px; z-index: 0; clip-path: var(--cut); background: radial-gradient(circle at 35% 35%, var(--pod-core) 0%, var(--pod-deep) 60%, var(--pod-ink) 100%); }
.pod::before { inset: 0; z-index: 1;
  clip-path: polygon(evenodd, 20% 0, 70% 0, 100% 18%, 100% 72%, 78% 100%, 28% 100%, 0 77%, 0 23%, 20% 0, 22.8% 11.8%, 8.7% 26.5%, 8.7% 72%, 30.4% 88.2%, 73.9% 88.2%, 91.3% 66.2%, 91.3% 25%, 67.4% 11.8%, 22.8% 11.8%);
  background: linear-gradient(160deg, #f2c8ff 0%, var(--pod-edge) 45%, #6a1aa8 100%); }
.pod b { position: relative; z-index: 2; font-family: 'Orbitron', 'Impact', 'Arial Black', sans-serif; font-weight: 900; font-size: 17px; letter-spacing: 0; line-height: 1; display: block; text-align: center; width: 100%; color: var(--pod-ink); -webkit-text-stroke: 1.5px var(--pod-glow); text-shadow: 0 0 4px var(--pod-edge); transform: rotate(8deg); }

/* Back button: asymmetrical purple pod + stretched label, scaled into the corner */

.back-cluster.pressed .purple-pod-btn, .back-cluster:active .purple-pod-btn { transform: rotate(-12deg) scale(0.92); }
.back-cluster:focus-visible { outline: 2px solid var(--pod-glow); outline-offset: 6px; }

.term { position: fixed; inset: 0; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(34px * var(--u) + env(safe-area-inset-top, 0px)) calc(44px * var(--u) + env(safe-area-inset-bottom, 0px)); background: rgba(10, 0, 22, 0.55); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }

  clip-path: polygon(var(--cr) 0, 100% 0, 100% calc(100% - var(--cr)), calc(100% - var(--cr)) 100%, 0 100%, 0 var(--cr)); }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const ITEMS = ['Xbox', 'Xbox 360', 'Arcade', 'Files', 'Settings'];
const COLOR = new THREE.Color('#b98aff');
const RADIUS = 3.5; // widened a bit so the bigger orb has room inside the ring
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('scene');
// early-2000s look: no antialiasing, rendered at ~480 lines and scaled up with hard pixels
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
const LINES = 480;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x4a0080, 6, 13);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);

// purple backdrop: deep violet field, magenta haze band at the horizon, a big glow behind
// the orb with faint concentric halo rings; drawn at render resolution so it shares the retro pixels
function makeBackground(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w); c.height = Math.max(1, h);
  const x = c.getContext('2d');
  const cx = w * 0.5, cy = h * 0.46, m = Math.max(w, h);

  // same recipe as the pods and menu items: #b300ff core -> #4a0080 -> #1a0033, centered on the orb
  const v = x.createRadialGradient(cx, cy, 0, cx, cy, m * 0.75);
  v.addColorStop(0, '#b300ff');
  v.addColorStop(0.45, '#4a0080');
  v.addColorStop(1, '#1a0033');
  x.fillStyle = v; x.fillRect(0, 0, w, h);

  // horizon haze band in the pod rim colour, where the ring sits
  const hz = x.createLinearGradient(0, h * 0.5, 0, h * 0.75);
  hz.addColorStop(0, 'rgba(204, 51, 255, 0)');
  hz.addColorStop(0.5, 'rgba(204, 51, 255, 0.14)');
  hz.addColorStop(1, 'rgba(204, 51, 255, 0)');
  x.fillStyle = hz; x.fillRect(0, h * 0.5, w, h * 0.25);

  // faint halo rings radiating out from the orb
  x.lineWidth = 1;
  for (let i = 1; i <= 9; i++) {
    const r = m * 0.07 * i * (1 + i * 0.06);
    x.strokeStyle = `rgba(204, 51, 255, ${0.16 - i * 0.014})`;
    x.beginPath(); x.ellipse(cx, cy, r, r * 0.92, 0, 0, Math.PI * 2); x.stroke();
  }

  // dark edges so the purple pools in the middle
  const vg = x.createRadialGradient(cx, cy, m * 0.3, cx, cy, m * 0.75);
  vg.addColorStop(0, 'rgba(5, 0, 12, 0)');

// panel face = the A/B pod stretched sideways: same lopsided capsule ends, plum core,

function podPath(x, x0, y0, w, h, inset = 0) {
  // chamfered panel: each corner cut at a different angle so it keeps the lopsided pod feel;
  // cut sizes are in pod pixels (pod is 130 tall) and scale with height so only the middle stretches
  const k = h / 130;
  const tl = [36 * k, 30 * k], tr = [54 * k, 24 * k], br = [40 * k, 36 * k], bl = [50 * k, 30 * k];
  const X0 = x0 + inset, Y0 = y0 + inset, X1 = x0 + w - inset, Y1 = y0 + h - inset;
  const q = inset * 0.4; // shrink cuts a touch on inner outlines so the bevel stays parallel
  x.beginPath();
  x.moveTo(X0 + tl[0] - q, Y0);
  x.lineTo(X1 - tr[0] + q, Y0);
  x.lineTo(X1, Y0 + tr[1] - q);
  x.lineTo(X1, Y1 - br[1] + q);
  x.lineTo(X1 - br[0] + q, Y1);
  x.lineTo(X0 + bl[0] - q, Y1);
  x.lineTo(X0, Y1 - bl[1] + q);
  x.lineTo(X0, Y0 + tl[1] - q);
  x.closePath();
}

    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  trigger(name) {
    if (name === 'move') this.blip(660, 0.08, 'triangle', 0.1, 1.2);
    if (name === 'select') { this.blip(440, 0.18, 'sine', 0.18, 2); setTimeout(() => this.blip(880, 0.25, 'sine', 0.12, 1.5), 60); }
    if (name === 'back') this.blip(520, 0.15, 'triangle', 0.12, 0.5);
  }
};

/* ---------- state + input ---------- */
let index = 0, pulse = 0, booted = false;
const nowEl = document.getElementById('now');
const toast = document.getElementById('toast');
let toastTimer;

/* ---------- file explorer ---------- */
const keysEl = document.getElementById('keys');
const filesEl = document.getElementById('files');
const listEl = document.getElementById('flist');
const devsEl = document.getElementById('devs');
const pathEl = document.getElementById('fpath');
const POD_A = '<i class="pod"><b>A</b></i>', POD_B = '<i class="pod"><b>B</b></i>';
const POD_X = '<i class="pod"><b>X</b></i>', POD_Y = '<i class="pod"><b>Y</b></i>';
const KEYS_MAIN = '<span>◀ ▶ MOVE</span><span>' + POD_A + 'SELECT</span><span>' + POD_B + 'BACK</span>';
const KEYS_XBOX = '<span>◀ ▶ BROWSE</span><span>' + POD_A + 'LAUNCH</span><span>' + POD_B + 'BACK</span>';
const KEYS_FILES = '<span>' + POD_A + 'OPEN</span><span class="opt">' + POD_X + 'DELETE</span><span class="opt">' + POD_Y + 'COPY / MOVE</span><span>' + POD_B + 'BACK</span>';
keysEl.innerHTML = KEYS_MAIN;
const DEVICES = [
  { n: 'HDD1', free: '212 GB FREE', used: 58, path: 'HDD1:\\' },
  { n: 'USB0', free: '41 GB FREE', used: 84, path: 'USB0:\\' },
  { n: 'DVD', free: 'NO DISC', used: 0, path: 'DVD:\\' }
];
const FILES = [
  ['DIR', '..', ''], ['DIR', 'Xbox', '—'], ['DIR', 'Xbox 360', '—'], ['DIR', 'Arcade', '—'],
  ['DIR', 'Content', '—'], ['DIR', 'Art', '128 MB'], ['FILE', 'launch.ini', '2 KB'], ['FILE', 'notes.txt', '1 KB']
];
let filesOpen = false, dev = 0, row = 0;
const meter = (p) => { const n = Math.round(p / 10); return '[' + '█'.repeat(n) + '░'.repeat(10 - n) + '] ' + p + '%'; };
const curFiles = () => DEVICES[dev].n === 'DVD' ? [['---', 'NO DISC', '']] : FILES;
function renderFiles() {
  devsEl.innerHTML = DEVICES.map((d, i) => `<div class="dev${i === dev ? ' on' : ''}"><span>${d.n}</span><span class="meter">${meter(d.used)}</span><span class="meter">${d.free}</span></div>`).join('');
  pathEl.textContent = DEVICES[dev].path;
  listEl.innerHTML = curFiles().map((f, i) => `<li class="row${i === row ? ' on' : ''}" data-i="${i}"><span class="t">${f[0]}</span><span class="n">${i === row ? '> ' : '  '}${f[1]}</span><span class="s">${f[2]}</span></li>`).join('');
  listEl.children[row]?.scrollIntoView({ block: 'nearest' });
}
function openFiles() {
  filesOpen = true; dev = 0; row = 0;
  filesEl.hidden = false;
  nowEl.textContent = 'FILES';
  keysEl.innerHTML = KEYS_FILES;
  renderFiles();
}
function closeFiles() {
  filesOpen = false;
  filesEl.hidden = true;
  nowEl.textContent = ''; // only named while inside a menu item
  keysEl.innerHTML = KEYS_MAIN;
 
  audio.trigger('back');
}
function openRow() {
  const f = curFiles()[row];
  if (!f || f[0] === '---') return;
  audio.trigger('select');
  toast.textContent = 'OPEN ' + f[1].toUpperCase();
  toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('on'), 900);
}
function filesKey(k, e) {
  const n = curFiles().length;
  if (k === 'ArrowUp' || k === 'ArrowDown') { e?.preventDefault(); row = (row + (k === 'ArrowUp' ? -1 : 1) + n) % n; audio.trigger('move'); renderFiles(); }
  else if (k === 'ArrowLeft') move(-1);
  else if (k === 'ArrowRight') move(1);
  else if (k === 'Enter' || k === ' ') { e?.preventDefault(); openRow(); }
  else if (k === 'Escape' || k === 'Backspace' || k.toLowerCase() === 'b') { e?.preventDefault(); back(); }
}
listEl.addEventListener('click', (e) => {
  const li = e.target.closest('.row');
  if (!li) return;
  const i = Number(li.dataset.i);
  if (i === row) openRow(); else { row = i; audio.trigger('move'); renderFiles(); }
});

function openXbox() {
  xboxOpen = true;
  library.visible = true;
  infoEl.hidden = false;
  nowEl.textContent = 'XBOX';
  keysEl.innerHTML = KEYS_XBOX;
  renderGameInfo();
}
function closeXbox() {
  xboxOpen = false;
  infoEl.hidden = true;
  nowEl.textContent = '';
  keysEl.innerHTML = KEYS_MAIN;
  audio.trigger('back');
}
function launchGame() {
  pulse = 1;
  audio.trigger('select');
  toast.textContent = 'LAUNCHING ' + GAMES[gi].t.toUpperCase();
  toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('on'), 1400);
}

function move(dir) {
  if (xboxOpen) {
    const ng = Math.min(GAMES.length - 1, Math.max(0, gi + dir));
    if (ng !== gi) { gi = ng; audio.trigger('move'); renderGameInfo(); }
    return;
  }
  if (filesOpen) {
    dev = (dev + dir + DEVICES.length) % DEVICES.length; row = 0;
    audio.trigger('move'); renderFiles();
    return;
  }
  index = (index + dir + ITEMS.length) % ITEMS.length;
 
  audio.trigger('move');
}
function select(i) {
  if (i !== undefined && i !== index) { index = i; audio.trigger('move'); return; }
  pulse = 1;
  audio.trigger('select');
  toast.textContent = 'OPENING ' + ITEMS[index].toUpperCase();
  toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('on'), 1100);
  if (ITEMS[index] === 'Files') setTimeout(openFiles, 350);
  if (ITEMS[index] === 'Xbox') setTimeout(openXbox, 250);
}

// one back action for keyboard and gamepad: closes Files if open
function back() {
  if (filesOpen) closeFiles();
  else if (xboxOpen) closeXbox();
  else audio.trigger('back');
}

document.getElementById('boot').addEventListener('click', (e) => {
  audio.start();
  booted = true;
  e.currentTarget.hidden = true;
});

addEventListener('keydown', (e) => {
  if (!booted) return;
  if (filesOpen) { filesKey(e.key, e); return; }
  if (xboxOpen && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); launchGame(); return; }
  if (e.key === 'ArrowLeft') move(-1);
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(); }
  else if (e.key === 'Escape' || e.key === 'Backspace' || e.key.toLowerCase() === 'b') back();
});

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downX = null;
canvas.addEventListener('pointerdown', (e) => { downX = e.clientX; });
canvas.addEventListener('pointerup', (e) => {
  if (downX === null) return;
  const dx = e.clientX - downX; downX = null;
  if (Math.abs(dx) > 40) { move(dx < 0 ? 1 : -1); return; }
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (xboxOpen) {
    const h = ray.intersectObjects(cases.map(c => c.mesh))[0];
    if (h) { const i = h.object.userData.gi; if (i === gi) launchGame(); else { gi = i; audio.trigger('move'); renderGameInfo(); } }
    return;
  }
  const hit = ray.intersectObjects(panels.map(p => p.fill))[0];
  if (hit) select(hit.object.userData.index);
});

let lastPad = 0, prevA = false, prevB = false;
function pollPad(t) {
  const pad = navigator.getGamepads?.()[0];
  if (!pad || !booted) return;
  const x = pad.axes[0] ?? 0, y = pad.axes[1] ?? 0;
  const left = pad.buttons[14]?.pressed || x < -0.5, right = pad.buttons[15]?.pressed || x > 0.5;
  const up = pad.buttons[12]?.pressed || y < -0.5, down = pad.buttons[13]?.pressed || y > 0.5;
  if (t - lastPad > 200) {
    if (left || right) { move(left ? -1 : 1); lastPad = t; }
    else if (filesOpen && (up || down)) { filesKey(up ? 'ArrowUp' : 'ArrowDown'); lastPad = t; }
  }
  const a = pad.buttons[0]?.pressed, b = pad.buttons[1]?.pressed;
  if (a && !prevA) { if (filesOpen) openRow(); else if (xboxOpen) launchGame(); else select(); }
  if (b && !prevB) back();
  prevA = a; prevB = b;
}

/* ---------- resize ---------- */
let camDist = 6.5, camDistLib = 6.5, camZNow = 6.5;
// view switcher: FULL fills the screen, 16:9 and 4:3 letterbox the stage to that shape
const stage = document.getElementById('stage');
const viewBtn = document.getElementById('view');
const MODES = [['FULL', 0], ['16:9', 16 / 9], ['4:3', 4 / 3]];
let mode = 0;
try { mode = Math.max(0, MODES.findIndex(m => m[0] === localStorage.getItem('orbit-view'))); } catch {}
function layoutStage() {
  const W = innerWidth, H = innerHeight, r = MODES[mode][1];
  let w = W, h = H;
  if (r) { if (W / H > r) { w = Math.round(H * r); } else { h = Math.round(W / r); } }
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.setProperty('--u', Math.min(1.8, Math.max(0.6, h / 480)).toFixed(3));
  document.body.classList.toggle('boxed', !!r);
  viewBtn.textContent = 'VIEW: ' + MODES[mode][0];
  return [w, h];
}
viewBtn.addEventListener('click', () => {
  mode = (mode + 1) % MODES.length;
  try { localStorage.setItem('orbit-view', MODES[mode][0]); } catch {}
  audio.trigger('move');
  resize();
});
function resize() {
  const [w, h] = layoutStage();
  const pr = Math.min(1, LINES / h);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(pr);
  composer.setSize(w, h);
  retro.uniforms.uRes.value.set(Math.round(w * pr), Math.round(h * pr));
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 75 : 50;
  camera.updateProjectionMatrix();
  // landscape: keep the whole ring in frame horizontally. 16:9 stays at the default distance;
  // narrower screens like 4:3 pull the camera back just enough that the side panels clear the edges
  if (w / h < 0.8) { camDist = 8.5; camDistLib = 8.5; }
  else {
    const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
    // ring + half a selected panel + margin; never closer than 8.2 so the front panel clears the bottom bar
    camDist = Math.max(8.2, (RADIUS + 1.9) / tanH);
    // the game row only needs the front case and its neighbours in frame, so 4:3 can stay close
    camDistLib = Math.max(6.5, 2.6 / tanH);
  }
  scene.background?.dispose?.();
  scene.background = makeBackground(Math.round(w * pr), Math.round(h * pr));
}
addEventListener('resize', resize);
resize();

/* ---------- clock ---------- */
const clockEl = document.getElementById('clock');
function tick() { clockEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
tick(); setInterval(tick, 15000);

/* ---------- loop ---------- */
const clock = new THREE.Clock();
function frame(t) {
  const dt = Math.min(clock.getDelta(), 0.05);
  const speed = reduceMotion ? 0.3 : 1;
  uniforms.uTime.value += dt * speed;
  retro.uniforms.uTime.value = reduceMotion ? 0 : clock.elapsedTime;
  pulse = Math.max(0, pulse - dt * 2.5);
  uniforms.uPulse.value = pulse;
  // nucleus breathes slowly and swells on select
  nucleus.scale.setScalar((1.2 + Math.sin(uniforms.uTime.value * 1.3) * 0.03 + pulse * 0.08) * orbK);

  const target = -index * step;
  const cur = ring.rotation.y;
  const diff = Math.atan2(Math.sin(target - cur), Math.cos(target - cur));
  ring.rotation.y = cur + diff * (1 - Math.exp(-6 * dt));

  // Xbox library: ring tucks away, orb floats up, cases fan out in a light cover-flow
  const ringS = THREE.MathUtils.damp(ring.scale.x, xboxOpen ? 0.001 : 1, 7, dt);
  ring.scale.setScalar(ringS); ring.visible = ringS > 0.01;
  const libS = THREE.MathUtils.damp(library.scale.x, xboxOpen ? 1 : 0.001, 7, dt);
  library.scale.setScalar(libS); library.visible = libS > 0.01;
  // orb rises and shrinks a little so it hovers above the cases instead of behind them
  const orbY = THREE.MathUtils.damp(coreMesh.position.y, xboxOpen ? 0.6 : 0, 5, dt);
  coreMesh.position.y = orbY; nucleus.position.y = orbY;
  orbK = THREE.MathUtils.damp(orbK, 1, 5, dt); // orb keeps full size; the cases sit in front of it
  coreMesh.scale.setScalar(1.5 * orbK);
  if (library.visible) {
    const sway = reduceMotion ? 0 : Math.sin(clock.elapsedTime * 0.8) * 0.12;
    cases.forEach((cs) => {
      const d = cs.i - gi, ad = Math.abs(d), sg = Math.sign(d);
      const tx = d === 0 ? 0 : sg * (0.95 + (ad - 1) * 0.5);
      const tz = d === 0 ? 0.55 : -0.15 - ad * 0.08;
      const ry = d === 0 ? sway : -sg * 0.95;
      const ts = d === 0 ? 1.18 : 0.92;
      const hd = cs.holder;
      hd.position.x = THREE.MathUtils.damp(hd.position.x, tx, 9, dt);
      hd.position.z = THREE.MathUtils.damp(hd.position.z, tz, 9, dt);
      hd.position.y = d === 0 ? Math.sin(clock.elapsedTime * 1.1) * 0.03 : 0;
      hd.rotation.y = THREE.MathUtils.damp(hd.rotation.y, ry, 9, dt);
      hd.scale.setScalar(THREE.MathUtils.damp(hd.scale.x, ts, 9, dt));
      hd.visible = ad <= 4;
      cs.rim.material.opacity = THREE.MathUtils.damp(cs.rim.material.opacity, d === 0 ? 1 : 0.25, 9, dt);
      const lv = d === 0 ? 1 : 0.55;
      cs.front.color.setScalar(THREE.MathUtils.damp(cs.front.color.r, lv, 9, dt));
    });
  }

  panels.forEach((p, i) => {
    const active = i === index;
    const s = THREE.MathUtils.damp(p.g.scale.x, active ? 1.5 : 1.1, 8, dt);
    p.g.scale.setScalar(s);
    p.fill.material.opacity = THREE.MathUtils.damp(p.fill.material.opacity, active ? 0.1 : 0.03, 8, dt);
    // dim unselected pods by darkening, not fading, so the letters stay solid
    const lv = THREE.MathUtils.damp(p.text.material.color.r, active ? 1 : 0.55, 8, dt);
    p.text.material.color.setScalar(lv);
    p.text.material.opacity = 1;
  });

  const et = clock.elapsedTime * speed;
  camZNow = THREE.MathUtils.damp(camZNow, xboxOpen ? camDistLib : camDist, 4, dt);
  const camZ = camZNow;
  camera.position.set(Math.sin(et * 0.1) * 0.3, 1.2 + Math.sin(et * 0.13) * 0.15, camZ);
  camera.lookAt(0, 0, 0);

  pollPad(t);
  composer.render();
  requestAnimationFrame(frame);
}

document.fonts?.load('900 100px Orbitron').then(() => {
  panels.forEach(p => { p.text.material.map.dispose(); p.text.material.map = labelTexture(p.label); });
  cases.forEach(cs => {
    cs.front.map.dispose(); cs.front.map = coverTexture(cs.game, cs.i);
    cs.spine.map.dispose(); cs.spine.map = spineTexture(cs.game);
  });
}).catch(() => {});

requestAnimationFrame(frame);
</script>
